<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Підбір дисків на ваше авто — ZE-Shina</title>
<meta name="description" content="Оберіть своє авто і радіус — побачите диски, які точно підходять: в наявності та під замовлення, з цінами за комплект. ZE-Shina, Харків, з 2007 року.">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111316;--card:#1A1D21;--line:#262A30;--tx:#F2F2F0;--mut:#A9ADB3;--acc:#F5A524;--ink:#15120A;--ok:#7BE39A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 24px}
.h{font-family:Unbounded,sans-serif;font-weight:700}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.back{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#E6E7E9;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back.hid{visibility:hidden}
.small{font-size:15px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.steps div{display:flex;flex-direction:column;gap:5px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#7D828A}
.steps div:before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps .done:before{background:var(--acc)}.steps .cur{color:var(--tx)}
.body{display:flex;flex-direction:column;gap:10px}
.body.in{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.car{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.car span{font-size:15px;color:var(--mut);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{min-height:72px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip b{font-size:22px}.chip span{font-size:14px;color:var(--mut)}
button{transition:transform .12s,border-color .2s}button:active{transform:scale(.97)}
.card{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.ph{position:relative;aspect-ratio:1/1;background:#0D0F11}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .nop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#9aa3ad;font-size:17px;line-height:1.5;padding:20px}
.ph .cnt{position:absolute;bottom:10px;right:10px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);font-size:13px;color:#fff}
.th{display:flex;gap:6px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none}.th::-webkit-scrollbar{display:none}
.th button{flex:none;width:62px;height:62px;padding:0;border-radius:10px;border:2px solid transparent;overflow:hidden;background:#0D0F11;cursor:pointer;opacity:.7}
.th button.on{border-color:var(--acc);opacity:1}.th img{width:100%;height:100%;object-fit:cover;display:block}
.tag.eu{background:#16233A;color:#8EC5FF;border:1px solid #2B4A75}
.eu-box{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.eu-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;background:none;border:0;color:var(--tx);font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;text-align:left}
.eu-h span{color:var(--mut);font-weight:500;font-size:14px;display:block;margin-top:3px}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.row .i{flex:1;min-width:0}.row .i b{display:block;font-size:16px}.row .i div{font-size:14px;color:var(--mut)}
.row .p{font-family:Unbounded,sans-serif;font-size:16px;color:var(--acc);white-space:nowrap}
.row button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:0;background:var(--acc);color:var(--ink);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.ph .tag{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;font-size:14px;font-weight:800}
.tag.st{background:#1B2A1F;color:var(--ok);border:1px solid #2F5A3A}.tag.ord{background:#2A2312;color:var(--acc);border:1px solid #5A4A22}
.ph .nav{position:absolute;top:0;bottom:0;width:30%;background:none;border:0;cursor:pointer}
.ph .nav.l{left:0}.ph .nav.r{right:0}
.ci{padding:14px;display:flex;flex-direction:column;gap:6px}
.ci .t{font-size:18px;font-weight:800}
.ci .sz{font-size:16px;color:#C9CCD0}
.ci .pr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.ci .pr b{font-family:Unbounded,sans-serif;font-size:22px;color:var(--acc)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--acc);color:var(--ink);font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;border:0;width:100%;cursor:pointer;text-decoration:none}
.note{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;color:var(--mut);line-height:1.5}
.warn{background:#2A2312;border-color:#5A4A22;color:#F3D49A}
.filt{display:flex;gap:8px}.filt button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#E6E7E9;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.filt button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--mut)}
input,textarea{border-radius:12px;border:1px solid #2E333A;background:var(--card);color:var(--tx);padding:0 14px;font-size:18px;font-family:inherit;height:50px}
textarea{height:80px;padding:10px 14px;font-size:16px}
.tel{display:flex}.tel .pre{display:flex;align-items:center;padding:0 4px 0 14px;height:50px;border:1px solid #2E333A;border-right:0;border-radius:12px 0 0 12px;background:var(--card);font-size:18px}
.tel input{flex:1;min-width:0;border-left:0;border-radius:0 12px 12px 0;padding-left:2px}
.via{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.via button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#E6E7E9;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.via button.on{border-color:var(--acc);background:#2A2312;color:var(--acc)}
.err{color:#F87171;font-size:15px}
.okbox{text-align:center;padding:10px 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.lnk{background:none;border:0;color:var(--mut);font-family:inherit;font-size:16px;cursor:pointer;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><button class="back hid" id="back" type="button" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div><div class="h" style="font-size:19px" id="title">Підбір дисків</div><div class="small">ZE-Shina · Харків · з 2007 року</div></div></div>
 <div class="steps" id="steps"><div>Авто</div><div>Радіус</div><div>Диски</div></div>
 <div class="body" id="body"></div>
</div>
<div class="modal" id="m"><div class="sheet" id="sh"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyk9BTRvqwtN_wGF1GXqJUlCPCr5-xo1W13oyKEH8KktKd-5stX-nofwnBuSupRyaBo/exec';
const NOTE=(()=>{const m=(r,v)=>r+' можуть не стати на '+v+' з М-гальмами (великі супорти). Надішліть фото супорта — перевіримо безкоштовно.';return{'BMW X5 (G05)':{18:m('R18–R19','M50i/M60i та версії'),19:m('R18–R19','M50i/M60i та версії')},'BMW X6 (G06)':{19:m('R19','M50i/M60i та версії')},'BMW 5 (G30/G31)':{17:m('R17–R18','M550i та версії'),18:m('R17–R18','M550i та версії')},'BMW 3 (G20/G21)':{17:m('R17–R18','M340i та версії'),18:m('R17–R18','M340i та версії')}};})();
const YRS={'BMW X5 (G05)':'2018–2025','BMW X6 (G06)':'2019–2025','BMW X7 (G07)':'2019–2025','BMW 5 (G30/G31)':'2017–2023','BMW 3 (G20/G21)':'2019–2025'};
let D={},S={step:0,car:null,R:null,f:'all'},LAST=-1;
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('uk-UA').replace(/ /g,' ');
const TAG={own:['st','В наявності'],ws:['ord','Під замовлення · 1–2 дні'],eu:['eu','Під замовлення з ЄС · 10–14 днів']};
const STK={own:'в наявності',ws:'під замовлення (Україна, 1–2 дні)',eu:'під замовлення з ЄС (10–14 днів)'};
const sz=x=>x.t==='st'?'перед '+x.f[0]+'J ET'+x.f[1]+' · зад '+x.r[0]+'J ET'+x.r[1]:x.f[0]+'J ET'+x.f[1]+' · 4 однакових';
function render(){
 const b=$('#body');b.innerHTML='';if(S.step!==LAST){b.classList.remove('in');void b.offsetWidth;b.classList.add('in');LAST=S.step;}
 $('#back').classList.toggle('hid',S.step===0);
 [...$('#steps').children].forEach((x,i)=>x.className=(i<=S.step?'done ':'')+(i===S.step?'cur':''));
 if(S.step===0){$('#title').textContent='Підбір дисків';
  b.insertAdjacentHTML('beforeend','<div class="small">Оберіть ваше авто — покажемо тільки ті диски, що точно стають</div>');
  Object.keys(D).forEach(c=>{const n=Object.values(D[c]).reduce((a,v)=>a+v.length,0);const e=document.createElement('button');e.type='button';e.className='car';e.innerHTML='<div>'+c+'<br><span>'+(YRS[c]||'')+'</span></div><span>'+n+' варіантів ›</span>';e.onclick=()=>{S.car=c;S.step=1;render();};b.appendChild(e);});
  b.insertAdjacentHTML('beforeend','<div class="note">Немає вашого авто? Напишіть нам — підберемо вручну.<br><a href="https://t.me/Den_ZEshina" style="color:var(--acc)">Telegram</a> · <a href="tel:+380957722173" style="color:var(--acc)">095 772 21 73</a></div>');
 }else if(S.step===1){$('#title').textContent=S.car;
  b.insertAdjacentHTML('beforeend','<div class="small">Оберіть радіус дисків</div><div class="chips" id="ch"></div>');
  Object.keys(D[S.car]).forEach(R=>{const l=D[S.car][R],st=l.filter(x=>x.s==='own').length;const e=document.createElement('button');e.type='button';e.className='chip';e.innerHTML='<b>R'+R+'</b><span>'+l.length+' вар.'+(st?' · '+st+' в наявн.':'')+'</span>';e.onclick=()=>{S.R=R;S.step=2;S.f='all';S.open=false;render();window.scrollTo(0,0);};$('#ch').appendChild(e);});
 }else{$('#title').textContent=S.car+' · R'+S.R;
  let l=D[S.car][S.R];const ns=l.filter(x=>x.s==='own').length,no=l.length-ns;
  b.insertAdjacentHTML('beforeend','<div class="filt"><button type="button" data-f="all">Усі ('+l.length+')</button><button type="button" data-f="st">В наявності ('+ns+')</button><button type="button" data-f="ord">Під замовл. ('+no+')</button></div>');
  b.querySelectorAll('[data-f]').forEach(x=>{x.classList.toggle('on',x.dataset.f===S.f);x.onclick=()=>{S.f=x.dataset.f;render();};});
  const nt=(NOTE[S.car]||{})[S.R];if(nt)b.insertAdjacentHTML('beforeend','<div class="note warn">⚠ '+nt+'</div>');
  if(S.f==='st')l=l.filter(x=>x.s==='own');if(S.f==='ord')l=l.filter(x=>x.s!=='own');
  if(!l.length)b.insertAdjacentHTML('beforeend','<div class="note">В наявності в цьому радіусі зараз немає — дивіться «Під замовлення».</div>');
  const cards=l.filter(x=>x.s!=='eu'||x.im.length),rows=l.filter(x=>x.s==='eu'&&!x.im.length);
  cards.forEach(x=>{const imgs=x.im||[];const e=document.createElement('div');e.className='card';const tg=TAG[x.s];
   e.innerHTML='<div class="ph">'+(imgs.length?'<img loading="lazy" alt="Диски '+x.col+' R'+S.R+'" src="img2/'+imgs[0]+'">':'<div class="nop">📷<br>Фото саме цього кольору<br>надішлемо в Telegram / Viber</div>')+'<span class="tag '+tg[0]+'">'+tg[1]+'</span>'+(imgs.length>1?'<span class="cnt">1 / '+imgs.length+'</span>':'')+'</div>'+
    (imgs.length>1?'<div class="th">'+imgs.map((f,i)=>'<button type="button" class="'+(i?'':'on')+'" aria-label="Фото '+(i+1)+'"><img loading="lazy" alt="" src="img2/'+f+'"></button>').join('')+'</div>':'')+
    '<div class="ci"><div class="t">R'+S.R+' · '+x.col+'</div><div class="sz">'+sz(x)+'</div><div class="small">Підходить для '+S.car+'</div><div class="pr"><span class="small">за комплект 4 шт.</span><b>'+fmt(x.p)+' грн</b></div><button class="cta" type="button">Хочу цей комплект</button></div>';
   const im=e.querySelector('.ph img'),tb=e.querySelectorAll('.th button'),cn=e.querySelector('.cnt');
   tb.forEach((t,i)=>t.onclick=()=>{im.src='img2/'+imgs[i];tb.forEach((u,j)=>u.classList.toggle('on',i===j));if(cn)cn.textContent=(i+1)+' / '+imgs.length;t.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});});
   e.querySelector('.cta').onclick=()=>lead(x);b.appendChild(e);});
  if(rows.length){const bx=document.createElement('div');bx.className='eu-box';
   bx.innerHTML='<button type="button" class="eu-h"><div>Ще '+rows.length+' варіантів з Європи<span>Під замовлення 10–14 днів · фото надішлемо в Telegram / Viber</span></div><b>'+(S.open?'−':'+')+'</b></button>';
   if(S.open)rows.forEach(x=>{const r=document.createElement('div');r.className='row';r.innerHTML='<div class="i"><b>'+x.col+'</b><div>'+sz(x)+'</div></div><div class="p">'+fmt(x.p)+' грн</div><button type="button">Хочу</button>';r.querySelector('button').onclick=()=>lead(x);bx.appendChild(r);});
   bx.querySelector('.eu-h').onclick=()=>{S.open=!S.open;render();};b.appendChild(bx);}
  b.insertAdjacentHTML('beforeend','<div class="note">Ціни за комплект із 4 дисків. Доставка Новою поштою по Україні, примірка та встановлення в Харкові (вул. Шевченка, 24). Остаточну наявність підтвердимо при замовленні.</div>');
 }}
const LV={via:'tg'};
function lead(x){const m=$('#m'),sh=$('#sh');
 sh.innerHTML='<div class="h" style="font-size:18px">Залишіть контакт</div><div class="small">'+S.car+' · R'+S.R+' · '+x.col+'<br>'+sz(x)+' · '+fmt(x.p)+' грн</div>'+
  '<label>Ваше ім’я<input id="ln" autocomplete="name"></label><label>Телефон *<span class="tel"><span class="pre">+38 0</span><input id="lp" type="tel" inputmode="numeric" placeholder="99 123 45 67" maxlength="20"></span></label>'+
  '<div class="small">Як вам відповісти?</div><div class="via"><button type="button" data-v="tg">Telegram</button><button type="button" data-v="viber">Viber</button><button type="button" data-v="call">Дзвінок</button></div>'+
  '<label>Коментар<textarea id="lc" placeholder="Рік, двигун, чи потрібні шини"></textarea></label><div class="err" id="le"></div><button class="cta" type="button" id="ls">Надіслати</button><button class="lnk" type="button" id="lx">Скасувати</button>';
 const vb=sh.querySelectorAll('[data-v]');const sv=()=>vb.forEach(b=>b.classList.toggle('on',b.dataset.v===LV.via));vb.forEach(b=>b.onclick=()=>{LV.via=b.dataset.v;sv();});sv();
 const lp=$('#lp');lp.oninput=()=>{let d=lp.value.replace(/\D/g,'');if(d.startsWith('380'))d=d.slice(3);else if(d.startsWith('0'))d=d.slice(1);d=d.slice(0,9);lp.value=[d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(' ');};
 $('#lx').onclick=()=>m.classList.remove('on');m.onclick=e=>{if(e.target===m)m.classList.remove('on');};
 $('#ls').onclick=()=>{const ph=lp.value.replace(/\D/g,'');if(!/^(39|50|63|66|67|68|73|75|77|91|92|93|94|95|96|97|98|99)\d{7}$/.test(ph)){$('#le').textContent='Введіть мобільний номер повністю';return;}
  const btn=$('#ls');btn.disabled=true;btn.textContent='Надсилаємо…';
  const body={action:'lead',id:x.id,car:S.car,R:S.R,col:x.col,size:sz(x),price:x.p,stock:STK[x.s],name:$('#ln').value.trim().slice(0,60),phone:'0'+ph,via:LV.via,note:$('#lc').value.trim().slice(0,300),src:new URLSearchParams(location.search).get('src')||''};
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json()).then(j=>{
   if(j.ok){sh.innerHTML='<div class="okbox"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg><div class="h" style="font-size:20px">Заявку надіслано!</div><div class="small">Менеджер зв’яжеться з вами найближчим часом'+(LV.via==='call'?' дзвінком':LV.via==='viber'?' у Viber':' у Telegram')+'.</div><a class="cta" href="tel:+380957722173">📞 Подзвонити · 095 772 21 73</a><button class="lnk" type="button" id="lx2">Закрити</button></div>';$('#lx2').onclick=()=>m.classList.remove('on');}
   else{btn.disabled=false;btn.textContent='Надіслати';$('#le').textContent='Не вдалося надіслати — подзвоніть 095 772 21 73';}
  }).catch(()=>{btn.disabled=false;btn.textContent='Надіслати';$('#le').textContent='Немає зв’язку — спробуйте ще раз або подзвоніть 095 772 21 73';});};
 m.classList.add('on');}
$('#back').onclick=()=>{if(S.step>0){S.step--;render();}};
fetch('data.json?v=3').then(r=>r.json()).then(j=>{D=j;const q=new URLSearchParams(location.search);const c=q.get('car');if(c){const k=Object.keys(D).find(x=>x.toLowerCase().includes(c.toLowerCase()));if(k){S.car=k;S.step=1;const R=q.get('r');if(R&&D[k][R]){S.R=R;S.step=2;}}}render();}).catch(()=>{$('#body').innerHTML='<div class="note">Не вдалося завантажити каталог. Оновіть сторінку.</div>';});
</script>
</body>
</html>
